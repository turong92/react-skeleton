name: new-project
# scripts/new-project.sh 로 겹치지 않는 조합(--core: 기본값 · packages · ssr-without-storybook · 레시피 셋)을 찍어 각각 pnpm install · format · tokens:check · capabilities:check · lint · typecheck · test · format:check · build (네트워크 필요, 순차).
# 열 조합 전부(--full)는 하루 한 번 nightly.yml 이 돈다. 앱 · 패키지 변경 자체는 ci.yml 의 build 잡이 검사한다
on:
  push:
    branches: [main]
    paths: [
        'scripts/**',
        'capabilities.json',
        'docs/new-project-recipe.md',
        'apps/starter/**', # 찍힐 때 그대로 따라가는 앱 + 레시피(community)가 --with-sample 이라 sample 도
        'apps/sample/**',
        'apps/starter-ssr/**',
        'apps/storybook/**',
        'package.json',
        'pnpm-workspace.yaml',
        'eslint.config.js',
        'tests/**', # 루트 tests 는 찍은 프로젝트에 따라가 그 프로젝트의 pnpm test 로 돈다
        '.github/workflows/new-project.yml',
      ]
  pull_request:
    paths: [
        'scripts/**',
        'capabilities.json',
        'docs/new-project-recipe.md',
        'apps/starter/**', # 찍힐 때 그대로 따라가는 앱 + 레시피(community)가 --with-sample 이라 sample 도
        'apps/sample/**',
        'apps/starter-ssr/**',
        'apps/storybook/**',
        'package.json',
        'pnpm-workspace.yaml',
        'eslint.config.js',
        'tests/**', # 루트 tests 는 찍은 프로젝트에 따라가 그 프로젝트의 pnpm test 로 돈다
        '.github/workflows/new-project.yml',
      ]

concurrency:
  group: new-project-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stamp-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          # cache: 'pnpm' 은 두지 않는다 - 이 잡은 저장소 루트에서 pnpm install 을 안 한다(찍은 프로젝트들이 임시 폴더에서 자기 install 을 한다).
          # setup-node 의 Post 단계는 `pnpm store path` 의 폴더를 저장하려 하는데, 찍은 프로젝트의 임시 폴더가 다른 파일시스템이면 pnpm 이 스토어를 기본 위치가 아닌
          # 그 파일시스템 쪽(.pnpm-store)에 만들어 기본 폴더가 없고, 검사는 통과해도 「Path Validation Error」로 잡이 실패한다
      - run: bash scripts/test-new-project.sh --core
